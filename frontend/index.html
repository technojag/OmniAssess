<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07080f" />
    <meta name="description" content="Adaptive assessment and career readiness practice." />
    <meta name="application-name" content="OmniAssess AI" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>OmniAssess AI | Assess with intent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-ink text-slate-100">
    <div id="root">
      <main style="min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Sora,system-ui,sans-serif;background:#07080f;color:#f8fafc">
        <div style="width:min(100%,620px);text-align:center">
          <p style="color:#3ee0b5;font-size:12px;letter-spacing:.16em;text-transform:uppercase">OmniAssess AI</p>
          <h1 style="font-family:Georgia,serif;font-size:clamp(32px,7vw,58px);line-height:1.02;margin:12px 0">Your learning twin is loading.</h1>
          <p style="color:#94a3b8;line-height:1.7;max-width:520px;margin:0 auto">Adaptive assessments, knowledge tracing, confidence calibration, misconception signals, personalized study paths, interviews, and explainable readiness reports.</p>
          <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:24px auto;max-width:560px">
            <span style="border:1px solid #1e2233;border-radius:999px;padding:8px 12px;color:#cbd5e1;font-size:12px">Knowledge graph</span>
            <span style="border:1px solid #1e2233;border-radius:999px;padding:8px 12px;color:#cbd5e1;font-size:12px">Adaptive MCQ</span>
            <span style="border:1px solid #1e2233;border-radius:999px;padding:8px 12px;color:#cbd5e1;font-size:12px">AI interview</span>
            <span style="border:1px solid #1e2233;border-radius:999px;padding:8px 12px;color:#cbd5e1;font-size:12px">Integrity signals</span>
          </div>
        </div>
      </main>
    </div>
    <noscript>
      <p style="padding:24px;color:white;background:#07080f">OmniAssess AI needs JavaScript enabled to run.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>    
  </body>
</html>
