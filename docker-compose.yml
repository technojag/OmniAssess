# Optional local PostgreSQL. Default prototype uses SQLite (no Docker required).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: omniassess
      POSTGRES_PASSWORD: omniassess
      POSTGRES_DB: omniassess
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
